{{- $type := .Get "type" | default "info" -}}
{{- if ne $type "note" "tip" "important" "warning" "caution" -}}
  {{- errorf "unknown type of alert %s" $type -}}
{{- end -}}
<div class="alert {{ $type }}">
  <div>
    <div>
      {{ if .Get "title" }}
        <p class="alert-title">{{ .Get "title" }}</p>
      {{ end }}
      {{ .Inner | markdownify }}
    </div>
  </div>
</div>
